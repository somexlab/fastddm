name: Build and test

on:
  # trigger on all commits to main and develop
  # NOTE: pushes to main should be protected by branch protection rules
  push:
    branches:
      - main
      - develop

  # trigger on pull requests to main and develop
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

  # trigger on request
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      gpu: ${{ steps.filter.outputs.gpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            gpu:
              - "src/cuda/**"
              - "src/python/**"
              - "**/CMakeLists.txt"
              - "tests/**"
              - "install.py"
              - "pyproject.toml"

  build:
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v5

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🏗️ Build package and install through uv
        run: |
          uv pip install --upgrade pip
          python install.py -v --uv --cpp --extras=test

      - name: 🧪 Run tests
        run: |
          pytest -v

  build-cuda:
    needs: [build, changes]
    if: github.event.pull_request.draft == false && needs.changes.outputs.gpu == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubu24_T4, win11_x64_T4]
        python-version: ["3.14"]
        cuda-version: ["13.2.0"]
        include:
          - os: ubu24_T4
            cuda-method: network
            cuda-sub-packages: '["nvcc", "cudart", "nvml-dev"]'
            cuda-non-cuda-sub-packages: '["libcufft", "libcufft-dev"]'
          - os: win11_x64_T4
            cuda-method: local
            cuda-sub-packages: "[]"
            cuda-non-cuda-sub-packages: "[]"

    steps:
      - uses: actions/checkout@v4

      - name: 🧑‍💻 Set up CUDA ${{ matrix.cuda-version }}
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.34
        with:
          cuda: ${{ matrix.cuda-version }}
          method: ${{ matrix.cuda-method }}
          sub-packages: ${{ matrix.cuda-sub-packages }}
          non-cuda-sub-packages: ${{ matrix.cuda-non-cuda-sub-packages }}

      - name: ✅ Verify CUDA installation
        run: |
          nvcc -V
          nvidia-smi

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v5

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🏗️ Build package and install through uv with CUDA support
        run: |
          uv pip install --upgrade pip
          python install.py -v --uv --gpu --extras=test

      - name: 🧪 Run tests with CUDA support
        run: |
          pytest -v
